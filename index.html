<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dual Recorder: 16:9 + 9:16</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6a65;--accent:#d9381e;--line:#e3e1da;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--text:#f2f1ec;--muted:#9a9890;--accent:#ff6a4d;--line:#33332f}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--text:#f2f1ec;--muted:#9a9890;--accent:#ff6a4d;--line:#33332f}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:14px 14px 130px}
h1{font-size:1.25rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
#timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
#timer.on{color:var(--accent);font-weight:600}
#msg{color:var(--muted);font-size:.9rem;min-height:1.4em;margin-bottom:10px}
#msg.err{color:var(--accent)}
.views{display:flex;gap:14px;align-items:flex-start;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.card h2{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.h{flex:2 1 0}.v{flex:0 0 230px}
canvas{display:block;width:100%;height:auto;background:#000;border-radius:8px}
button{font:inherit;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 18px;border-radius:999px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.out{display:none;margin-top:8px}.out.on{display:block}
.out video{width:100%;border-radius:8px;background:#000}
.out button{margin-top:8px;width:100%}
video#src{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;justify-content:center;align-items:center;
 padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bar button{flex:1 1 0;max-width:200px;white-space:nowrap}
#rec{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;flex:1.4 1 0}
#start{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600;flex:1.4 1 0}
@media (max-width:700px){
 .views{flex-direction:column;align-items:stretch}
 .v{order:-1;flex:none;width:min(100%,calc(52dvh * 9 / 16 + 22px));margin:0 auto}
 .h{order:1;flex:none;width:100%}
 .bar button{padding:0 10px;font-size:.92rem}
}
</style>
</head>
<body>
<main>
<div class="top"><h1>Dual Recorder</h1><span id="timer">00:00</span></div>
<div id="msg">Press Start camera. You get a 9:16 and a 16:9 video at once.</div>

<div class="views">
  <div class="card h"><h2>Horizontal 16:9</h2><canvas id="ch" width="1280" height="720"></canvas>
    <div class="out" id="oh"><video controls playsinline></video><button>Save horizontal</button></div></div>
  <div class="card v"><h2>Vertical 9:16</h2><canvas id="cv" width="720" height="1280"></canvas>
    <div class="out" id="ov"><video controls playsinline></video><button>Save vertical</button></div></div>
</div>
<video id="src" muted playsinline autoplay></video>
</main>

<div class="bar">
  <button id="flip" disabled aria-label="Switch camera">⟲ Flip</button>
  <button id="start">Start camera</button>
  <button id="rec" disabled style="display:none">● Record</button>
  <button id="both" disabled>Save both</button>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var src=$('src'),ch=$('ch'),cv=$('cv'),msg=$('msg'),timer=$('timer');
  var cxh=ch.getContext('2d'),cxv=cv.getContext('2d');
  var vTrack=null,aTracks=[],facing='user',started=false,
      recs=[],blobs={},chunks={h:[],v:[]},t0=0,tick=null,recording=false,downloads=null;

  function say(t,err){msg.textContent=t;msg.className=err?'err':''}

  function pickMime(){
    var list=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(var i=0;i<list.length;i++){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(list[i]))return list[i]}
    return '';
  }
  var mime=pickMime(),ext=mime.indexOf('mp4')>-1?'mp4':'webm';

  function draw(ctx,c){
    var vw=src.videoWidth,vh=src.videoHeight;
    if(!vw)return;
    var s=Math.max(c.width/vw,c.height/vh),w=vw*s,h=vh*s;
    ctx.drawImage(src,(c.width-w)/2,(c.height-h)/2,w,h);
  }
  function loop(){draw(cxh,ch);draw(cxv,cv);requestAnimationFrame(loop)}

  async function openVideo(f){
    var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:f},width:{ideal:1920},height:{ideal:1080}},audio:false});
    var t=s.getVideoTracks()[0];
    if(vTrack)vTrack.stop();
    vTrack=t;
    src.srcObject=new MediaStream([t]);
    await src.play();
    facing=f;
  }

  $('start').onclick=async function(){
    if(started)return;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Camera is not supported here. Use HTTPS and a recent browser.',true);return}
    try{
      var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:1920},height:{ideal:1080}},audio:true});
      aTracks=s.getAudioTracks();
      vTrack=s.getVideoTracks()[0];
    }catch(e){
      try{
        var s2=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
        vTrack=s2.getVideoTracks()[0];
        say('Microphone unavailable, recording without sound.',true);
      }catch(e2){say('Could not open the camera ('+(e2.name||'error')+'). Allow camera access, or open this page in its own browser tab.',true);return}
    }
    src.srcObject=new MediaStream([vTrack]);
    try{await src.play()}catch(e){}
    started=true;
    $('start').style.display='none';
    $('rec').style.display='';$('rec').disabled=false;$('flip').disabled=false;
    var st=vTrack.getSettings&&vTrack.getSettings();
    if(st&&st.facingMode)facing=st.facingMode;
    if(!aTracks.length||msg.className!=='err')say('Camera ready ('+(facing==='environment'?'back':'front')+'). Press Record.');
    loop();
  };

  $('flip').onclick=async function(){
    if(!started)return;
    var next=facing==='user'?'environment':'user';
    $('flip').disabled=true;
    try{await openVideo(next);say('Using the '+(next==='environment'?'back':'front')+' camera.')}
    catch(e){say('Could not switch camera ('+(e.name||'error')+').',true);
      try{await openVideo(facing)}catch(e2){}}
    $('flip').disabled=false;
  };

  function makeRec(canvas,key){
    var out=canvas.captureStream(30);
    aTracks.forEach(function(t){out.addTrack(t)});
    var r=new MediaRecorder(out,mime?{mimeType:mime,videoBitsPerSecond:5000000}:{});
    chunks[key]=[];
    r.ondataavailable=function(e){if(e.data&&e.data.size)chunks[key].push(e.data)};
    r.onstop=function(){finish(key)};
    return r;
  }

  function finish(key){
    var blob=new Blob(chunks[key],{type:mime||'video/webm'});
    var box=$(key==='h'?'oh':'ov'),vid=box.querySelector('video');
    if(vid.dataset.url)URL.revokeObjectURL(vid.dataset.url);
    var url=URL.createObjectURL(blob);
    vid.dataset.url=url;vid.src=url;
    box.classList.add('on');
    blobs[key]=blob;
    $('both').disabled=!(blobs.h&&blobs.v);
    box.querySelector('button').onclick=function(){saveOne(key)};
  }

  async function saveOne(key){
    var blob=blobs[key];
    if(!blob)return;
    var name=(key==='h'?'horizontal-16x9.':'vertical-9x16.')+ext;
    try{
      if(downloads){
        await downloads.save({filename:name,data:blob});
        say('Saved '+name+'. On iPhone choose Save Video; on Android check Gallery or Downloads.');
      }else if(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:blob.type})]})){
        await navigator.share({files:[new File([blob],name,{type:blob.type})]});
      }else{
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
        document.body.appendChild(a);a.click();a.remove();
        say('Downloaded '+name+'.');
      }
    }catch(e){if(!e||(e.code!=='declined'&&e.name!=='AbortError'))say('Could not save ('+((e&&(e.code||e.name))||'error')+').',true)}
  }
  $('both').onclick=async function(){await saveOne('h');await saveOne('v')};

  $('rec').onclick=function(){
    if(!started)return;
    if(!recording){
      if(!window.MediaRecorder){say('Recording is not supported in this browser.',true);return}
      blobs={};$('both').disabled=true;
      recs=[makeRec(ch,'h'),makeRec(cv,'v')];
      recs.forEach(function(r){r.start(1000)});
      recording=true;t0=Date.now();
      $('rec').textContent='■ Stop';timer.className='on';
      say('Recording both formats. You can flip the camera while recording.');
      tick=setInterval(function(){
        var s=Math.floor((Date.now()-t0)/1000);
        timer.textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2);
      },250);
    }else{
      recs.forEach(function(r){if(r.state!=='inactive')r.stop()});
      recording=false;clearInterval(tick);timer.className='';
      $('rec').textContent='● Record';
      say('Done. Preview below, then save.');
    }
  };

  try{if(window.claude&&claude.use){claude.use('downloads').then(function(d){downloads=d}).catch(function(){})}}catch(e){}
})();
</script>
</body>
</html>
